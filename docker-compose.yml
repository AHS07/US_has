version: "3.9"

# HealthFlow — Docker Compose
# Services: api, worker, postgres, redis, mongo, frontend
# Only api and frontend are exposed to the host; everything else is internal.

x-api-common: &api-common
  build:
    context: ./healthflow
    dockerfile: ../docker/api/Dockerfile
  env_file:
    - ./healthflow/.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mongo:
      condition: service_healthy
  volumes:
    - ./healthflow:/app

services:

  api:
    <<: *api-common
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *api-common
    command: celery -A config.celery worker --loglevel=info
    ports: []

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthflow}
      POSTGRES_USER: ${POSTGRES_USER:-healthflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    # Placeholder — replace with your actual frontend build/image
    image: nginx:alpine
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  mongo_data:
